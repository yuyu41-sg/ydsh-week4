<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>云购生活 · 经营数据大屏</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/js/china.js"></script>
<script src="data.js"></script>
<style>
  :root { --panel-bg: rgba(12, 34, 68, 0.55); --accent: #37e2e5; --accent2: #ffcf4b; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #060e21; overflow: hidden; }
  #screen {
    width: 1920px; height: 1080px; transform-origin: left top;
    background: radial-gradient(ellipse at 50% 0%, #0c2248 0%, #060e21 60%),
                repeating-linear-gradient(0deg, transparent 0 59px, rgba(55,226,229,0.03) 59px 60px);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #d9ecff; display: flex; flex-direction: column; padding: 18px 24px;
  }
  header { height: 72px; display: flex; align-items: center; justify-content: space-between; }
  header .deco { width: 420px; height: 8px; background: linear-gradient(90deg, transparent, var(--accent)); opacity: .6; }
  header .deco.r { transform: scaleX(-1); }
  header h1 { font-size: 34px; letter-spacing: 8px; color: #fff;
    text-shadow: 0 0 18px rgba(55,226,229,.8); }
  header .sub { font-size: 14px; color: #7fa7cc; margin-top: 4px; }
  main { flex: 1; display: grid; grid-template-columns: 470px 1fr 470px; gap: 16px; margin-top: 8px; }
  .col { display: flex; flex-direction: column; gap: 16px; }
  .panel { background: var(--panel-bg); border: 1px solid rgba(55,226,229,.25); border-radius: 8px;
    padding: 12px 14px 6px; position: relative; display: flex; flex-direction: column; }
  .panel::before { content: ""; position: absolute; top: -1px; left: -1px; width: 14px; height: 14px;
    border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); border-radius: 8px 0 0 0; }
  .panel::after { content: ""; position: absolute; bottom: -1px; right: -1px; width: 14px; height: 14px;
    border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent); border-radius: 0 0 8px 0; }
  .panel h3 { font-size: 16px; color: var(--accent); letter-spacing: 2px; margin-bottom: 4px; }
  .panel h3::before { content: "◆ "; font-size: 12px; }
  .chart { flex: 1; min-height: 0; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .kpi { background: linear-gradient(180deg, rgba(55,226,229,.12), transparent);
    border: 1px solid rgba(55,226,229,.3); border-radius: 8px; text-align: center; padding: 10px 0; }
  .kpi .num { font-size: 30px; font-weight: 700; color: var(--accent2); font-family: Consolas, monospace; }
  .kpi .num small { font-size: 14px; color: #9db9d8; font-weight: 400; }
  .kpi .lab { font-size: 13px; color: #9db9d8; margin-top: 2px; }
  #mapPanel { flex: 1.35; }
</style>
</head>
<body>
<div id="screen">
  <header>
    <div class="deco"></div>
    <div style="text-align:center">
      <h1>云购生活 · 经营数据大屏</h1>
      <div class="sub">2024 全年经营数据 ｜ 数据源：ydsh_ads / ydsh_dws（Hive）｜ 云购生活新零售数仓项目</div>
    </div>
    <div class="deco r"></div>
  </header>

  <div class="kpis" style="margin-top:8px">
    <div class="kpi"><div class="num" id="kpiGmv"><small>计算中…</small></div><div class="lab">全期 GMV（万元）</div></div>
    <div class="kpi"><div class="num" id="kpiOrders">-</div><div class="lab">订单量</div></div>
    <div class="kpi"><div class="num" id="kpiAov"><small>元</small></div><div class="lab">客单价</div></div>
    <div class="kpi"><div class="num" id="kpiRepurchase">-</div><div class="lab">复购率</div></div>
  </div>

  <main>
    <div class="col">
      <div class="panel" style="flex:1">
        <h3>月度 GMV 趋势（万元）</h3>
        <div id="chartTrend" class="chart"></div>
      </div>
      <div class="panel" style="flex:1">
        <h3>品类销售额对比</h3>
        <div id="chartCat" class="chart"></div>
      </div>
    </div>

    <div class="col">
      <div class="panel" id="mapPanel">
        <h3>区域销售分布（省份热力地图）</h3>
        <div id="chartMap" class="chart"></div>
      </div>
      <div class="panel" style="height:300px">
        <h3>时段 × 品类 销量热力图</h3>
        <div id="chartHeat" class="chart"></div>
      </div>
    </div>

    <div class="col">
      <div class="panel" style="flex:1">
        <h3>支付方式占比</h3>
        <div id="chartPay" class="chart"></div>
      </div>
      <div class="panel" style="flex:1">
        <h3>门店销售 Top10</h3>
        <div id="chartTop" class="chart"></div>
      </div>
      <div class="panel" style="height:190px">
        <h3>客单价 × 折扣 相关性（月度散点）</h3>
        <div id="chartScat" class="chart"></div>
      </div>
    </div>
  </main>
</div>

<script>
// ---------- 大屏自适应：整体 scale 缩放（设计稿 1920×1080） ----------
const screen = document.getElementById('screen');
function resize() {
  const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  screen.style.transform = 'scale(' + scale + ')';
  screen.style.left = (window.innerWidth - 1920 * scale) / 2 + 'px';
  screen.style.top = (window.innerHeight - 1080 * scale) / 2 + 'px';
}
window.addEventListener('resize', resize);
resize();

const D = window.SCREEN_DATA;
const charts = {};
function mk(id) { charts[id] = echarts.init(document.getElementById(id)); return charts[id]; }
const axisStyle = { axisLine: { lineStyle: { color: '#2a5a8a' } }, axisLabel: { color: '#9db9d8', fontSize: 11 } };

// ---------- KPI ----------
document.getElementById('kpiGmv').innerHTML = (14151214.68 / 10000).toFixed(2) + '<small>万</small>';
document.getElementById('kpiOrders').textContent = '5,642';
document.getElementById('kpiAov').innerHTML = '2,508.19<small>元</small>';
document.getElementById('kpiRepurchase').textContent = '98.09%';

// ---------- 1 月度趋势 ----------
mk('chartTrend').setOption({
  tooltip: { trigger: 'axis' },
  legend: { textStyle: { color: '#9db9d8' }, top: 0, right: 0, itemWidth: 14 },
  grid: { left: 60, right: 50, top: 28, bottom: 26 },
  xAxis: { type: 'category', data: D.monthly_trend.map(r => r.month), ...axisStyle },
  yAxis: [
    { type: 'value', name: 'GMV(万)', nameTextStyle: { color: '#9db9d8' }, ...axisStyle,
      splitLine: { lineStyle: { color: 'rgba(42,90,138,.4)' } } },
    { type: 'value', name: '订单', nameTextStyle: { color: '#9db9d8' }, ...axisStyle, splitLine: { show: false } }
  ],
  series: [
    { name: 'GMV(万)', type: 'line', smooth: true, data: D.monthly_trend.map(r => +(r.gmv / 10000).toFixed(1)),
      lineStyle: { width: 3, color: '#37e2e5' }, itemStyle: { color: '#37e2e5' },
      areaStyle: { color: 'rgba(55,226,229,.15)' }, symbolSize: 7 },
    { name: '订单量', type: 'bar', yAxisIndex: 1, data: D.monthly_trend.map(r => r.orders),
      itemStyle: { color: 'rgba(255,207,75,.65)' }, barWidth: 14 }
  ]
});

// ---------- 2 品类柱状 ----------
mk('chartCat').setOption({
  tooltip: { trigger: 'axis', valueFormatter: v => (v / 10000).toFixed(1) + ' 万' },
  grid: { left: 90, right: 40, top: 10, bottom: 26 },
  xAxis: { type: 'value', ...axisStyle, axisLabel: { color: '#9db9d8', formatter: v => (v / 10000) + '万' } },
  yAxis: { type: 'category', data: D.category_sales.map(r => r.category).reverse(), ...axisStyle },
  series: [{ type: 'bar', data: D.category_sales.map(r => r.sales).reverse(),
    itemStyle: { color: new echarts.graphic.LinearGradient(0, 0, 1, 0,
      [{ offset: 0, color: '#1b6fd8' }, { offset: 1, color: '#37e2e5' }]), borderRadius: 4 },
    barWidth: 14 }]
});

// ---------- 3 省份地图 ----------
const provData = D.province_sales.map(r => ({ name: r.province.replace(/省|市|自治区|壮族自治区|回族自治区|维吾尔自治区|特别行政区/g, ''), value: r.sales }));
mk('chartMap').setOption({
  tooltip: { trigger: 'item', valueFormatter: v => (v / 10000).toFixed(1) + ' 万' },
  visualMap: { min: 300000, max: 1700000, left: 8, bottom: 8,
    text: ['高', '低'], textStyle: { color: '#9db9d8' }, inRange: { color: ['#123d7a', '#37e2e5', '#ffcf4b'] } },
  series: [{
    type: 'map', map: 'china', roam: false,
    label: { show: true, color: '#b9d5f2', fontSize: 10 },
    itemStyle: { borderColor: 'rgba(55,226,229,.6)' },
    emphasis: { label: { color: '#fff', fontSize: 12 }, itemStyle: { areaColor: '#ffcf4b' } },
    data: provData
  }]
});

// ---------- 4 时段×品类热力 ----------
const hours = [...new Set(D.heatmap.map(r => r.hour))].sort();
const cats = [...new Set(D.heatmap.map(r => r.category))];
mk('chartHeat').setOption({
  tooltip: { position: 'top' },
  grid: { left: 80, right: 20, top: 8, bottom: 40 },
  xAxis: { type: 'category', data: hours.map(h => h + '时'), ...axisStyle, axisLabel: { color: '#9db9d8', fontSize: 10, interval: 1 } },
  yAxis: { type: 'category', data: cats, ...axisStyle, axisLabel: { color: '#9db9d8', fontSize: 10 } },
  visualMap: { min: 0, max: 150, calculable: true, orient: 'horizontal', left: 'center', bottom: 2,
    textStyle: { color: '#9db9d8' }, inRange: { color: ['#0c2248', '#1b6fd8', '#37e2e5', '#ffcf4b'] }, itemHeight: 60 },
  series: [{ type: 'heatmap', data: D.heatmap.map(r => [hours.indexOf(r.hour), cats.indexOf(r.category), r.qty]),
    itemStyle: { borderColor: 'rgba(6,14,33,.4)', borderWidth: 1 } }]
});

// ---------- 5 支付饼图 ----------
mk('chartPay').setOption({
  tooltip: { trigger: 'item', formatter: '{b}: {c} 单 ({d}%)' },
  legend: { bottom: 0, textStyle: { color: '#9db9d8' } },
  series: [{ type: 'pie', radius: ['42%', '68%'], center: ['50%', '44%'],
    data: D.pay_type.map(r => ({ name: r.name, value: r.count })),
    label: { color: '#b9d5f2', formatter: '{d}%' },
    itemStyle: { borderColor: '#0c2248', borderWidth: 2 },
    color: ['#37e2e5', '#ffcf4b', '#4bd88a', '#7b8cff'] }]
});

// ---------- 6 门店 Top10 ----------
mk('chartTop').setOption({
  tooltip: { trigger: 'axis', valueFormatter: v => (v / 10000).toFixed(1) + ' 万' },
  grid: { left: 150, right: 50, top: 8, bottom: 24 },
  xAxis: { type: 'value', ...axisStyle, axisLabel: { color: '#9db9d8', formatter: v => (v / 10000) + '万' } },
  yAxis: { type: 'category', data: D.store_top10.map(r => r.store).reverse(), ...axisStyle, axisLabel: { color: '#9db9d8', fontSize: 10 } },
  series: [{ type: 'bar', data: D.store_top10.map(r => r.sales).reverse(),
    itemStyle: { color: new echarts.graphic.LinearGradient(0, 0, 1, 0,
      [{ offset: 0, color: '#2a5a8a' }, { offset: 1, color: '#ffcf4b' }]), borderRadius: 4 }, barWidth: 12 }]
});

// ---------- 7 客单价×折扣散点 ----------
mk('chartScat').setOption({
  tooltip: { trigger: 'item', formatter: p => '客单价 ' + p.value[0] + ' 元 / 平均折扣 ' + p.value[1] + ' 元' },
  grid: { left: 55, right: 24, top: 12, bottom: 28 },
  xAxis: { type: 'value', name: '客单价', nameTextStyle: { color: '#9db9d8' }, ...axisStyle },
  yAxis: { type: 'value', name: '平均折扣', nameTextStyle: { color: '#9db9d8' }, ...axisStyle },
  series: [{ type: 'scatter', symbolSize: 12, data: D.aov_discount.map(r => [r.aov, r.discount]),
    itemStyle: { color: '#ffcf4b', opacity: .85 } }]
});

window.addEventListener('resize', () => Object.values(charts).forEach(c => c.resize()));
</script>
</body>
</html>
